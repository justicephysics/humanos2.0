<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Justice Physics Nalanda</title>
    
    <!-- Early script to prevent theme flashing (FOUC) -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme') || 'dark';
        if (saved === 'light') document.documentElement.classList.add('light-mode');
      })();
    </script>

    <style>
        /* Dark mode (default) */
        :root {
            --bg: #0B1A2F;
            --surface: #112240;
            --text: #ffffff;
            --text-secondary: #cccccc;
            --accent: #7FDBFF;
            --border: #1a3a5c;
            --radius: 10px;
        }
        /* Light mode */
        html.light-mode {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #444444;
            --accent: #0077b6;
            --border: #d0d7de;
        }
        
        /* Force enable text selection/copying */
        * {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 1.1rem;
            line-height: 1.7;
            padding: 2rem 1rem;
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1, h2, h3, h4 { color: var(--accent); margin-top: 1.5rem; margin-bottom: 1rem; }
        p, li { color: var(--text-secondary); margin-bottom: 1rem; }
        a { color: var(--accent); }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
        th, td { border: 1px solid var(--border); padding: 0.8rem 1rem; text-align: left; }
        th { color: var(--text); background: rgba(127, 219, 255, 0.05); }
        code { background: var(--surface); padding: 0.2rem 0.4rem; border-radius: 4px; font-family: 'Courier New', monospace; color: var(--accent); }
        pre { background: var(--surface); padding: 1rem; border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; }
        pre code { background: none; padding: 0; }
        blockquote { border-left: 4px solid var(--accent); padding-left: 1rem; margin: 1.5rem 0; color: var(--text-secondary); }
        hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
        
        /* Controls Bar */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent);
            font-weight: 600;
            border: 1px solid var(--accent);
            padding: 0.45rem 1rem;
            border-radius: var(--radius);
            transition: background 0.2s, color 0.2s;
        }
        .back-link:hover { background: var(--accent); color: var(--bg); }
        .theme-btn {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.45rem 1rem;
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, color 0.2s;
        }
        .theme-btn:hover { background: var(--accent); color: var(--bg); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Controls -->
        <div class="controls">
            <a href="https://justicephysics.github.io/humanos2.0/" class="back-link">← Back to Blueprint</a>
            <button type="button" id="theme-toggle" class="theme-btn" onclick="toggleTheme()">🌓 Day / Night</button>
        </div>
        
        <!-- This is where your Markdown content goes -->
        {{ content }}
    </div>

    <!-- Pre-process math to fix \% rendering issue specifically inside \text{} -->
    <script>
      (function() {
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        let node;
        while ((node = walker.nextNode())) {
          const text = node.nodeValue;
          // Only process if it contains \text{ and \%
          if (text && text.includes('\\text{') && text.includes('\\%')) {
            // Find \text{...} blocks and replace \%\% with $\%$ only inside them
            const newText = text.replace(/\\text\{([^{}]*)\}/g, (match) => {
              return match.split('\\%').join('$\\%$');
            });
            node.nodeValue = newText;
          }
        }
      })();
    </script>

    <!-- MathJax v3 for Equations -->
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

    <!-- Mermaid for Flowcharts -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        const themeBtn = document.getElementById('theme-toggle');

        function setTheme(mode) {
            if (mode === 'light') {
                document.documentElement.classList.add('light-mode');
                themeBtn.textContent = '🌙 Night Mode';
            } else {
                document.documentElement.classList.remove('light-mode');
                themeBtn.textContent = '☀️ Day Mode';
            }
            renderMermaid(mode);
        }

        window.toggleTheme = function() {
            const isLight = document.documentElement.classList.contains('light-mode');
            const newMode = isLight ? 'dark' : 'light';
            localStorage.setItem('theme', newMode);
            setTheme(newMode);
        };

        // Mermaid dynamic re-rendering
        function renderMermaid(theme) {
            if (typeof mermaid === 'undefined') return;
            
            const mermaidTheme = theme === 'light' ? 'default' : 'dark';
            mermaid.initialize({ startOnLoad: false, theme: mermaidTheme, securityLevel: 'loose' });
            
            // Reset and re-render existing mermaid blocks to apply the new theme
            document.querySelectorAll('.mermaid').forEach(div => {
                const originalCode = div.getAttribute('data-original-code');
                if (originalCode) {
                    div.removeAttribute('data-processed');
                    div.innerHTML = originalCode;
                }
            });

            mermaid.run({
                nodes: document.querySelectorAll('.mermaid')
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            // 1. Convert standard markdown code blocks into Mermaid divs
            document.querySelectorAll('code.language-mermaid').forEach(function (block) {
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.textContent;
                block.parentElement.replaceWith(div);
            });

            // 2. Save original code for dynamic re-rendering on theme change
            document.querySelectorAll('.mermaid').forEach(div => {
                div.setAttribute('data-original-code', div.textContent);
            });

            // 3. Load saved theme and apply it
            const saved = localStorage.getItem('theme') || 'dark';
            setTheme(saved);
        });
    </script>
</body>
</html>
