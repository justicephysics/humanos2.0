<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Justice Physics Nalanda</title>
    <style>
        /* Matching Dark Theme */
        :root {
            --bg: #0B1A2F;
            --surface: #112240;
            --text: #ffffff;
            --text-secondary: #cccccc;
            --accent: #7FDBFF;
            --border: #1a3a5c;
            --radius: 10px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 1.1rem;
            line-height: 1.7;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2, h3, h4 {
            color: var(--accent);
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }
        p, li {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        a { color: var(--accent); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 0.8rem 1rem;
            text-align: left;
        }
        th { color: var(--text); background: rgba(127, 219, 255, 0.05); }
        code {
            background: var(--surface);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: var(--accent);
        }
        pre {
            background: var(--surface);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow-x: auto;
        }
        pre code { background: none; padding: 0; }
        blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 1rem;
            margin: 1.5rem 0;
            color: var(--text-secondary);
        }
        hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 2rem 0;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            text-decoration: none;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
        }
        .back-link:hover { background: var(--accent); color: var(--bg); }
    </style>

    <!-- MathJax v3 for Equations -->
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

    <!-- Mermaid for Flowcharts -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('code.language-mermaid').forEach(function (block) {
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = block.textContent;
          block.parentElement.replaceWith(div);
        });
        if (typeof mermaid !== 'undefined') {
          mermaid.initialize({ startOnLoad: true, theme: 'dark' });
        }
      });
    </script>
</head>
<body>
    <div class="container">
        <!-- Back button for easy navigation -->
        <a href="https://justicephysics.github.io/humanos2.0/" class="back-link">← Back to Blueprint</a>
        
        <!-- This is where your Markdown content goes -->
        {{ content }}
    </div>
</body>
</html>
